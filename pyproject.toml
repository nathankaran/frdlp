[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frdlp"
version = "0.1.0"
description = "A focused terminal UI for yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "frdlp contributors" }]
dependencies = [
    "textual>=0.86",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
frdlp = "frdlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

